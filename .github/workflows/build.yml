name: Android Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake
      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer setuptools cython==0.29.36 wheel
      - name: Build Android APK
        env:
          BUILDOZER_WARN_ON_ROOT: 0
          ACCEPT_SDK_LICENSE: "true"
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          buildozer android debug
      - name: Upload Finished App
        uses: actions/upload-artifact@v4
        with:
          name: Finished-Android-App
          path: bin/*.apk
